name: Render slides

on:
  push:
    branches: [main]
    paths: ['posts/**/spec.json', 'posts/**/reel.json', 'posts/**/toon.json', 'posts/**/stories.json']
  workflow_dispatch:
    inputs:
      post:
        description: 'Post id to re-render (optional)'
        required: false

permissions:
  contents: write

concurrency:
  group: render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # ffmpeg from a ready-made static build (apt mirrors on the runners can hang for many minutes)
      - name: Install ffmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          ffmpeg-version: release
      - name: Render slides
        run: node engine/render.js ${{ github.event.inputs.post }}
      - name: Render reels
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          for f in posts/*/reel.json; do
            [ -e "$f" ] || continue
            d=$(dirname "$f"); id=$(basename "$d")
            [ -e "$d/reel-rendered.json" ] && continue
            eng=$(jq -r '.engine // 1' "$f")
            if [ "$eng" = "3" ]; then
              if [ "$(jq -r '.voice // false' "$f")" = "true" ]; then
                node engine/voice.js "$id" || { echo "{\"error\": \"voice failed\"}" > "$d/render-error.json"; continue; }
              fi
              node engine/reel3.js "$id" || echo "{\"error\": \"reel v3 render failed\"}" > "$d/render-error.json"
            elif [ "$eng" = "2" ]; then
              if [ "$(jq -r '.voice // false' "$f")" = "true" ]; then
                node engine/voice.js "$id" || { echo "{\"error\": \"voice failed\"}" > "$d/render-error.json"; continue; }
              fi
              node engine/reel2.js "$id" || echo "{\"error\": \"reel v2 render failed\"}" > "$d/render-error.json"
            else
              node engine/reel.js "$id" || echo "{\"error\": \"reel render failed\"}" > "$d/render-error.json"
            fi
          done
      - name: Render animated reels (engine 4)
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          for f in posts/*/toon.json; do
            [ -e "$f" ] || continue
            d=$(dirname "$f"); id=$(basename "$d")
            [ -e "$d/reel-rendered.json" ] && continue
            if [ "$(jq -r '.voice // false' "$f")" = "true" ]; then
              node engine/voice.js "$id" || { echo "{\"error\": \"voice failed\"}" > "$d/render-error.json"; continue; }
            fi
            node engine/toon.js "$id" || echo "{\"error\": \"toon render failed\"}" > "$d/render-error.json"
          done
      - name: Render stories
        run: |
          for f in posts/*/stories.json; do
            [ -e "$f" ] || continue
            d=$(dirname "$f"); id=$(basename "$d")
            [ -e "$d/stories-rendered.json" ] && continue
            node engine/story.js "$id" || echo "{\"error\": \"stories render failed\"}" > "$d/stories-error.json"
          done
      - name: Commit slides
        run: |
          git config user.name "creativia-sci-bot"
          git config user.email "creativia-sci-bot@users.noreply.github.com"
          git add posts
          git diff --cached --quiet && exit 0
          git commit -m "Render slides"
          git pull --rebase origin main
          git push
